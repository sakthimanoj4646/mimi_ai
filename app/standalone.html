<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>MIMI AI — Your Creative Video Studio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='25' fill='%230077B6'/><path d='M30 70 L30 30 L50 50 L70 30 L70 70' stroke='white' stroke-width='10' stroke-linecap='round' stroke-linejoin='round' fill='none'/><circle cx='50' cy='25' r='6' fill='%2300F0FF'/></svg>">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            ocean: {
              950: '#050A18',
              900: '#070D1E',
              850: '#0C162E',
              800: '#101C38',
              750: '#142449',
              700: '#1C2541',
              600: '#2A3F70',
              500: '#0077B6',
              400: '#0096C7',
              300: '#48CAE4',
            },
            cyan: {
              neon: '#00F0FF',
            },
            lavender: {
              400: '#B5A6FF',
              500: '#9D8DF1',
            }
          },
          boxShadow: {
            'ocean-glow': '0 0 25px -5px rgba(0, 240, 255, 0.3)',
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #070D1E; color: white; font-family: system-ui, -apple-system, sans-serif; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0B132B; }
    ::-webkit-scrollbar-thumb { background: #1C2541; border-radius: 9999px; }
  </style>
</head>
<body class="bg-ocean-950 text-white antialiased">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Procedural Sample Generator
    const createSampleClip = (durationSec = 5, title = "Cinematic Ocean") => {
      return new Promise((resolve) => {
        const canvas = document.createElement('canvas');
        canvas.width = 1280; canvas.height = 720;
        const ctx = canvas.getContext('2d');
        const stream = canvas.captureStream(30);
        const mimeType = MediaRecorder.isTypeSupported('video/webm') ? 'video/webm' : 'video/mp4';
        const recorder = new MediaRecorder(stream, { mimeType });
        const chunks = [];
        recorder.ondataavailable = e => { if (e.data.size > 0) chunks.push(e.data); };
        recorder.onstop = () => {
          const blob = new Blob(chunks, { type: mimeType });
          resolve({ url: URL.createObjectURL(blob), duration: durationSec, blob });
        };
        recorder.start();
        let f = 0; const total = durationSec * 30;
        const iv = setInterval(() => {
          if (f >= total) { clearInterval(iv); recorder.stop(); return; }
          const t = f / 30;
          const grad = ctx.createLinearGradient(0, 0, 0, 720);
          grad.addColorStop(0, '#070D1E'); grad.addColorStop(0.5, '#0077B6'); grad.addColorStop(1, '#00F0FF');
          ctx.fillStyle = grad; ctx.fillRect(0, 0, 1280, 720);
          ctx.fillStyle = 'rgba(7, 13, 30, 0.85)';
          ctx.beginPath(); ctx.moveTo(0, 480);
          for (let x = 0; x <= 1280; x += 20) {
            ctx.lineTo(x, 480 + Math.sin(x * 0.01 + t * 3) * 20);
          }
          ctx.lineTo(1280, 720); ctx.lineTo(0, 720); ctx.fill();
          ctx.fillStyle = '#FFFFFF'; ctx.font = 'bold 36px sans-serif'; ctx.textAlign = 'center';
          ctx.fillText(`MIMI AI — ${title.toUpperCase()}`, 640, 620);
          ctx.font = '18px sans-serif'; ctx.fillStyle = '#00F0FF';
          ctx.fillText(`Scene: ${t.toFixed(1)}s / ${durationSec}s • 1080p Ocean AI Canvas`, 640, 660);
          f++;
        }, 1000 / 30);
      });
    };

    function App() {
      const [screen, setScreen] = useState('splash');
      const [clips, setClips] = useState([]);
      const [activeClipIndex, setActiveClipIndex] = useState(0);
      const [projects, setProjects] = useState([]);
      const [plan, setPlan] = useState(null);
      const [messages, setMessages] = useState([
        { id: 1, sender: 'mimi', text: `Hey creator! I'm Mimi. 💙\nNeed editing tips, creative ideas, or help with a video?\nAsk me anything in English, Tamil, or Tanglish!` }
      ]);
      const [chatInput, setChatInput] = useState('');
      const [toasts, setToasts] = useState([]);

      const activeClip = clips[activeClipIndex];

      const addToast = (msg, type = 'info') => {
        const id = Date.now();
        setToasts(prev => [...prev, { id, msg, type }]);
        setTimeout(() => setToasts(prev => prev.filter(t => t.id !== id)), 3500);
      };

      useEffect(() => {
        const timer = setTimeout(() => setScreen('home'), 2200);
        return () => clearTimeout(timer);
      }, []);

      const loadDemoVideo = async () => {
        addToast('Generating procedural Ocean AI sample clip...', 'info');
        const s = await createSampleClip(5, "Sunset Glow");
        const newClip = {
          id: 'clip_' + Date.now(),
          name: 'Ocean Sunset Sample.mp4',
          url: s.url,
          duration: s.duration,
          brightness: 0,
          contrast: 1,
          saturation: 1,
          temperature: 0,
          speed: 1,
          filter: 'none',
          textOverlays: []
        };
        setClips([newClip]);
        setActiveClipIndex(0);
        addToast('Sample clip ready in studio workspace!', 'success');
        setScreen('editing_workspace');
      };

      const sendToMimi = (text) => {
        if (!text.trim()) return;
        const userMsg = { id: Date.now(), sender: 'user', text };
        setMessages(prev => [...prev, userMsg]);
        setChatInput('');

        setTimeout(() => {
          const lower = text.toLowerCase();
          const isTanglish = /(epdi|panrathu|pannu|venum|irukku|konjam|romba|nalla)/i.test(lower);
          const isTamil = /[\u0B80-\u0BFF]/.test(text);

          let reply = `I've prepared a validated editing plan for your request! 💙 Check the operations below and click 'Apply Edits'.`;
          if (isTanglish) {
            reply = `Super creator! Ungaloda instruction-kaga semmayaana editing plan ready panniten. Warm sunset grade & slow motion apply panlaam! 💙`;
          } else if (isTamil) {
            reply = `வணக்கம் கிரியேட்டர்! உங்கள் விருப்பத்திற்கு ஏற்ற எடிட்டிங் திட்டம் தயார். சரிபார்த்து 'Apply Edits' தேர்ந்தெடுக்கவும்! 💙`;
          }

          const newPlan = {
            title: 'Mimi AI Structured Plan',
            summary: `Tailored operations for: "${text.slice(0, 40)}"`,
            operations: [
              { label: 'Warm Sunset Grade', desc: '+20% contrast, +25% saturation, warm tone', type: 'color' },
              { label: 'Smooth Slow Motion (0.5x)', desc: 'Half-speed cinematic playback', type: 'speed' },
              { label: 'Travel Reel Cross Dissolve', desc: '0.6s inter-scene blend', type: 'transition' }
            ]
          };

          setPlan(newPlan);
          setMessages(prev => [...prev, { id: Date.now() + 1, sender: 'mimi', text: reply, plan: newPlan }]);
        }, 800);
      };

      const applyPlanToWorkspace = () => {
        if (!activeClip) {
          addToast('Please load a clip into the studio first.', 'warning');
          return;
        }
        setClips(prev => prev.map((c, i) => i === activeClipIndex ? {
          ...c,
          brightness: 0.05,
          contrast: 1.25,
          saturation: 1.3,
          temperature: 0.3,
          speed: 0.5,
          filter: 'warm'
        } : c));
        setPlan(null);
        addToast('All operations applied to video workspace!', 'success');
        setScreen('editing_workspace');
      };

      return (
        <div className="min-h-screen flex flex-col bg-ocean-950">
          {/* Toast Banner */}
          <div className="fixed top-4 right-4 z-50 space-y-2 max-w-sm pointer-events-none">
            {toasts.map(t => (
              <div key={t.id} className="pointer-events-auto p-3.5 rounded-2xl bg-ocean-900/95 border border-cyan-500/40 text-cyan-200 text-xs shadow-2xl backdrop-blur-md">
                {t.msg}
              </div>
            ))}
          </div>

          {/* Top Bar */}
          {screen !== 'splash' && (
            <header className="sticky top-0 z-40 bg-ocean-900/90 backdrop-blur-md border-b border-ocean-800 px-4 py-3 flex items-center justify-between">
              <div className="flex items-center space-x-3 cursor-pointer" onClick={() => setScreen('home')}>
                <div className="w-8 h-8 rounded-xl bg-gradient-to-tr from-ocean-500 to-cyan-neon flex items-center justify-center font-black shadow-ocean-glow">
                  M
                </div>
                <div>
                  <span className="font-bold text-white text-base">MIMI AI</span>
                  <span className="text-[10px] ml-1.5 px-1.5 py-0.5 rounded bg-ocean-800 text-cyan-neon border border-cyan-neon/30">STUDIO</span>
                </div>
              </div>

              <div className="flex items-center space-x-2">
                <button onClick={() => setScreen('mimi_chat')} className="px-3 py-1.5 rounded-full bg-ocean-800 hover:bg-ocean-750 text-cyan-neon border border-cyan-500/30 text-xs font-semibold">
                  Ask Mimi 💙
                </button>
                <button onClick={() => setScreen('help_support')} className="text-xs text-gray-400 hover:text-white px-2">
                  Help
                </button>
              </div>
            </header>
          )}

          {/* Screen Content Router */}
          <main className="flex-1 max-w-5xl w-full mx-auto p-4 sm:p-6 pb-20">
            {screen === 'splash' && (
              <div className="min-h-[80vh] flex flex-col items-center justify-center text-center space-y-4">
                <div className="w-20 h-20 rounded-3xl bg-gradient-to-tr from-ocean-500 to-cyan-neon flex items-center justify-center shadow-ocean-glow text-3xl font-black">
                  M
                </div>
                <h1 className="text-3xl font-black text-white">MIMI AI</h1>
                <p className="text-sm text-cyan-200">"Imagine It. Describe It. Create It."</p>
                <div className="w-36 h-1 bg-ocean-800 rounded-full overflow-hidden">
                  <div className="w-full h-full bg-cyan-neon animate-pulse" />
                </div>
              </div>
            )}

            {screen === 'home' && (
              <div className="space-y-6">
                <div>
                  <h1 className="text-2xl font-black text-white">Welcome, Creator! 🌊</h1>
                  <p className="text-xs text-gray-400">MIMI AI Creative Video Studio is active and ready.</p>
                </div>

                {/* Prompt Box */}
                <div className="bg-ocean-900 border border-ocean-800 rounded-3xl p-6 shadow-xl space-y-4">
                  <h3 className="text-sm font-bold text-white">What would you like to create today?</h3>
                  <div className="flex space-x-2">
                    <input
                      type="text"
                      placeholder="Describe your scene or edit in English, Tamil, or Tanglish..."
                      value={chatInput}
                      onChange={e => setChatInput(e.target.value)}
                      onKeyDown={e => e.key === 'Enter' && sendToMimi(chatInput)}
                      className="flex-1 bg-ocean-950 border border-ocean-800 focus:border-cyan-neon rounded-2xl px-4 py-3 text-xs text-white placeholder-gray-500 focus:outline-none"
                    />
                    <button
                      onClick={() => { sendToMimi(chatInput); setScreen('mimi_chat'); }}
                      className="px-5 py-3 rounded-2xl bg-gradient-to-r from-ocean-500 to-cyan-500 text-ocean-950 font-bold text-xs shadow-ocean-glow"
                    >
                      Send to Mimi
                    </button>
                  </div>
                  <div className="flex flex-wrap gap-2 text-xs">
                    {['Create cinematic sunset', 'Make video cinematic with warm colors', 'Mimi, cinematic editing epdi panrathu?'].map((p, i) => (
                      <button key={i} onClick={() => { setChatInput(p); sendToMimi(p); setScreen('mimi_chat'); }} className="px-3 py-1 rounded-xl bg-ocean-800 text-gray-300 hover:text-cyan-neon">
                        {p}
                      </button>
                    ))}
                  </div>
                </div>

                {/* Action Cards */}
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                  {[
                    { title: 'Create with AI', desc: 'Text to Video scene generator', screen: 'ai_create' },
                    { title: 'Video Studio', desc: 'Color grading, speed & timeline', screen: 'editing_workspace' },
                    { title: 'Combine Clips', desc: 'Merge multiple video scenes', screen: 'multi_clip' },
                    { title: 'Enhance Video', desc: 'Before & After comparison slider', screen: 'enhancement' },
                    { title: 'Ask Mimi', desc: 'Tamil, Tanglish & English AI buddy', screen: 'mimi_chat' },
                    { title: 'Try Demo Clip', desc: 'Instant 1080p procedural sample', action: loadDemoVideo },
                  ].map((c, i) => (
                    <div
                      key={i}
                      onClick={() => c.action ? c.action() : setScreen(c.screen)}
                      className="p-4 rounded-2xl bg-ocean-900 hover:bg-ocean-850 border border-ocean-800 hover:border-cyan-500/40 cursor-pointer transition-all space-y-1"
                    >
                      <h4 className="text-sm font-bold text-white">{c.title}</h4>
                      <p className="text-[11px] text-gray-400">{c.desc}</p>
                    </div>
                  ))}
                </div>
              </div>
            )}

            {screen === 'editing_workspace' && (
              <div className="space-y-6">
                <div className="flex items-center justify-between">
                  <div>
                    <h2 className="text-xl font-bold text-white">Video Studio Workspace</h2>
                    <p className="text-xs text-gray-400">Real-time color grading filters, speed control, and direct export.</p>
                  </div>
                  <div className="flex space-x-2">
                    <button onClick={loadDemoVideo} className="px-3 py-1.5 rounded-xl bg-ocean-800 text-cyan-neon border border-ocean-700 text-xs">
                      Load Sample
                    </button>
                    <button onClick={() => setScreen('export')} className="px-4 py-1.5 rounded-xl bg-gradient-to-r from-ocean-500 to-cyan-500 text-ocean-950 font-bold text-xs shadow-ocean-glow">
                      Export Video
                    </button>
                  </div>
                </div>

                {/* Player */}
                {activeClip ? (
                  <div className="space-y-4">
                    <div className="rounded-2xl overflow-hidden border border-ocean-800 bg-black max-h-[420px] flex items-center justify-center relative">
                      <video
                        src={activeClip.url}
                        controls
                        style={{
                          filter: `brightness(${1 + (activeClip.brightness || 0)}) contrast(${activeClip.contrast || 1}) saturate(${activeClip.saturation || 1}) sepia(${(activeClip.temperature || 0) * 0.3})`
                        }}
                        className="w-full max-h-[420px] object-contain"
                      />
                    </div>

                    {/* Color Grading Controls */}
                    <div className="bg-ocean-900 border border-ocean-800 rounded-3xl p-5 space-y-4">
                      <h3 className="text-xs font-bold text-ocean-300 uppercase">Interactive Color Grade Controls</h3>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-4 text-xs">
                        <div>
                          <div className="flex justify-between text-gray-300 mb-1">
                            <span>Brightness</span>
                            <span>{Math.round((activeClip.brightness || 0) * 100)}%</span>
                          </div>
                          <input
                            type="range" min="-0.5" max="0.5" step="0.05"
                            value={activeClip.brightness || 0}
                            onChange={e => setClips(clips.map((c, i) => i === activeClipIndex ? { ...c, brightness: parseFloat(e.target.value) } : c))}
                            className="w-full accent-cyan-400"
                          />
                        </div>

                        <div>
                          <div className="flex justify-between text-gray-300 mb-1">
                            <span>Contrast</span>
                            <span>{Math.round(((activeClip.contrast || 1) - 1) * 100)}%</span>
                          </div>
                          <input
                            type="range" min="0.5" max="1.8" step="0.05"
                            value={activeClip.contrast || 1}
                            onChange={e => setClips(clips.map((c, i) => i === activeClipIndex ? { ...c, contrast: parseFloat(e.target.value) } : c))}
                            className="w-full accent-cyan-400"
                          />
                        </div>

                        <div>
                          <div className="flex justify-between text-gray-300 mb-1">
                            <span>Saturation</span>
                            <span>{Math.round(((activeClip.saturation || 1) - 1) * 100)}%</span>
                          </div>
                          <input
                            type="range" min="0" max="2" step="0.05"
                            value={activeClip.saturation || 1}
                            onChange={e => setClips(clips.map((c, i) => i === activeClipIndex ? { ...c, saturation: parseFloat(e.target.value) } : c))}
                            className="w-full accent-cyan-400"
                          />
                        </div>

                        <div>
                          <div className="flex justify-between text-gray-300 mb-1">
                            <span>Warmth (Temperature)</span>
                            <span>{(activeClip.temperature || 0) > 0 ? 'Warm' : 'Cool'}</span>
                          </div>
                          <input
                            type="range" min="-0.5" max="0.5" step="0.05"
                            value={activeClip.temperature || 0}
                            onChange={e => setClips(clips.map((c, i) => i === activeClipIndex ? { ...c, temperature: parseFloat(e.target.value) } : c))}
                            className="w-full accent-cyan-400"
                          />
                        </div>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="p-12 text-center bg-ocean-900 border border-dashed border-ocean-800 rounded-3xl space-y-3">
                    <p className="text-sm font-semibold text-white">No video loaded in workspace</p>
                    <button onClick={loadDemoVideo} className="px-4 py-2 rounded-xl bg-gradient-to-r from-ocean-500 to-cyan-500 text-ocean-950 font-bold text-xs shadow-ocean-glow">
                      Load Procedural Ocean AI Clip
                    </button>
                  </div>
                )}
              </div>
            )}

            {screen === 'mimi_chat' && (
              <div className="space-y-4">
                <div className="flex items-center justify-between pb-2 border-b border-ocean-800">
                  <h2 className="text-base font-bold text-white">Mimi AI Creative Buddy 💙</h2>
                  <span className="text-[10px] font-mono text-cyan-300">English • Tamil • Tanglish</span>
                </div>

                <div className="h-96 overflow-y-auto space-y-3 p-2 bg-ocean-900/60 rounded-3xl border border-ocean-800">
                  {messages.map(m => (
                    <div key={m.id} className={`flex flex-col ${m.sender === 'user' ? 'items-end' : 'items-start'}`}>
                      <div className={`p-3.5 rounded-2xl max-w-[80%] text-xs leading-relaxed ${m.sender === 'user' ? 'bg-ocean-500 text-white' : 'bg-ocean-850 text-gray-200 border border-ocean-750'}`}>
                        <p className="whitespace-pre-line">{m.text}</p>
                        {m.plan && (
                          <div className="mt-3 p-3 bg-ocean-900 rounded-xl border border-cyan-500/30 space-y-2">
                            <span className="text-xs font-bold text-cyan-neon block">{m.plan.title}</span>
                            <p className="text-[11px] text-gray-400">{m.plan.summary}</p>
                            <div className="space-y-1">
                              {m.plan.operations.map((op, idx) => (
                                <p key={idx} className="text-[11px] text-white">• {op.label} ({op.desc})</p>
                              ))}
                            </div>
                            <button
                              onClick={applyPlanToWorkspace}
                              className="w-full mt-2 py-2 rounded-lg bg-gradient-to-r from-ocean-500 to-cyan-500 text-ocean-950 font-bold text-xs shadow-ocean-glow"
                            >
                              Apply Edits to Workspace
                            </button>
                          </div>
                        )}
                      </div>
                    </div>
                  ))}
                </div>

                <div className="flex space-x-2">
                  <input
                    type="text"
                    placeholder="Type in English, Tamil, or Tanglish (e.g. 'cinematic look epdi panrathu?')..."
                    value={chatInput}
                    onChange={e => setChatInput(e.target.value)}
                    onKeyDown={e => e.key === 'Enter' && sendToMimi(chatInput)}
                    className="flex-1 bg-ocean-900 border border-ocean-800 rounded-2xl px-4 py-3 text-xs text-white focus:outline-none focus:border-cyan-neon"
                  />
                  <button onClick={() => sendToMimi(chatInput)} className="px-5 py-3 rounded-2xl bg-cyan-neon text-ocean-950 font-bold text-xs shadow-ocean-glow">
                    Send
                  </button>
                </div>
              </div>
            )}

            {screen === 'export' && (
              <div className="space-y-5 bg-ocean-900 border border-ocean-800 rounded-3xl p-6">
                <h2 className="text-xl font-bold text-white">Export Final Video</h2>
                <p className="text-xs text-gray-400">All color grades and trims will be rendered to a downloadable video file.</p>
                {activeClip ? (
                  <div className="space-y-4">
                    <div className="p-4 rounded-2xl bg-ocean-950 border border-ocean-850 text-xs space-y-1">
                      <p>Clip: <span className="text-white font-bold">{activeClip.name}</span></p>
                      <p>Format: <span className="text-cyan-neon font-mono">1080p MP4 / WEBM</span></p>
                    </div>
                    <a
                      href={activeClip.url}
                      download="MIMI_AI_Export.webm"
                      className="block text-center w-full py-3.5 rounded-2xl bg-gradient-to-r from-ocean-500 via-cyan-neon to-lavender-400 text-ocean-950 font-bold text-xs shadow-ocean-glow"
                    >
                      Download Video File Now
                    </a>
                  </div>
                ) : (
                  <p className="text-xs text-gray-500">No active video clip to export.</p>
                )}
              </div>
            )}

            {screen === 'help_support' && (
              <div className="space-y-4 bg-ocean-900 border border-ocean-800 rounded-3xl p-6">
                <h2 className="text-xl font-bold text-white">Help & Frequently Asked Questions</h2>
                <div className="space-y-3 text-xs text-gray-300">
                  <div className="p-3.5 rounded-2xl bg-ocean-950 border border-ocean-850">
                    <p className="font-bold text-white">How does Tanglish AI work?</p>
                    <p className="mt-1">Mimi has a built-in multilingual tokenizer capable of parsing Tamil script and colloquial Tanglish words (e.g. 'panrathu', 'epdi', 'konjam') directly into structured editing instructions.</p>
                  </div>
                  <div className="p-3.5 rounded-2xl bg-ocean-950 border border-ocean-850">
                    <p className="font-bold text-white">How is video processed without external servers?</p>
                    <p className="mt-1">MIMI AI Studio employs an HTML5 Canvas and MediaRecorder stream engine that renders real pixel modifications and outputs real playable video Blobs on any modern browser.</p>
                  </div>
                </div>
              </div>
            )}
          </main>

          {/* Bottom Nav on Mobile */}
          <nav className="fixed bottom-0 inset-x-0 z-50 bg-ocean-900/95 border-t border-ocean-800 p-2 flex justify-around text-xs">
            {[
              { id: 'home', label: 'Home' },
              { id: 'editing_workspace', label: 'Studio' },
              { id: 'mimi_chat', label: 'Mimi 💙' },
              { id: 'export', label: 'Export' },
              { id: 'help_support', label: 'Help' }
            ].map(tab => (
              <button
                key={tab.id}
                onClick={() => setScreen(tab.id)}
                className={`py-1 px-3 rounded-lg ${screen === tab.id ? 'text-cyan-neon font-bold' : 'text-gray-400'}`}
              >
                {tab.label}
              </button>
            ))}
          </nav>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
